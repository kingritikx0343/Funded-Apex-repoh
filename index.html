    <script type="text/javascript">
      // Restore path from 404.html redirect when deployed on GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

    <script>
      // Guard against FedCM NotAllowedError and GSI logger notices when embedded in iframes
      (function() {
        if (typeof navigator !== 'undefined' && navigator.credentials) {
          const _origGet = navigator.credentials.get ? navigator.credentials.get.bind(navigator.credentials) : null;
          if (_origGet) {
            navigator.credentials.get = function(options) {
              if (options && options.identity) {
                return Promise.resolve(null);
              }
              return _origGet(options);
            };
          }
        }
        const filterGsi = function(args) {
          return args.some(a => {
            const str = typeof a === 'string' ? a : ((a && a.message) || String(a || ''));
            return str.includes('GSI_LOGGER') ||
                   str.includes('identity-credentials-get') ||
                   str.includes('FedCM get()') ||
                   str.includes('Failed to open popup window');
          });
        };
        ['error', 'warn', 'log', 'info'].forEach(function(method) {
          const orig = console[method];
          console[method] = function(...args) {
            if (filterGsi(args)) return;
            return orig.apply(console, args);
          };
        });
        window.addEventListener('error', function(event) {
          const msg = (event && (event.message || '')) || '';
          if (msg.includes('GSI_LOGGER') || msg.includes('identity-credentials-get') || msg.includes('Failed to open popup window')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
